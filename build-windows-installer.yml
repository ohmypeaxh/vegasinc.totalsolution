
name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build EXE
        run: pyinstaller GreenMetalAutomationSuite.spec
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y
      - name: Build Setup
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\setup.iss"'
      - uses: actions/upload-artifact@v4
        with:
          name: GreenMetal-Automation-Suite-Installer
          path: release/GreenMetal_Automation_Suite_Setup.exe
