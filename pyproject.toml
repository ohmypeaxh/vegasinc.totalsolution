[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vegas-total-solution-doc"
dynamic = ["version"]
description = "Vegas Total Solution Doc internal document automation foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6==6.8.3",
    "python-docx==1.1.2",
    "PyMuPDF==1.25.4",
    "requests==2.32.3",
    "keyring==25.6.0",
    "platformdirs==4.3.6",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-qt==4.4.0", "pyinstaller==6.12.0"]

[project.scripts]
vegas-doc = "vegas_doc.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "vegas_doc.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
