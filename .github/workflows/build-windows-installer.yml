name: Build Windows Installer

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "installer/**"
      - "scripts/**"
      - "Vegas_Total_Solution_Doc.spec"
      - ".github/workflows/build-windows-installer.yml"
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

jobs:
  build-windows-installer:
    name: Measure, test, optimize, and package
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install production and test dependencies
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run regression tests
        env:
          QT_QPA_PLATFORM: offscreen
          VEGAS_CLOVA_INVOKE_URL: ""
          VEGAS_CLOVA_SECRET_KEY: ""
        run: |
          $ErrorActionPreference = "Stop"
          python -m pytest -q

      - name: Install Inno Setup 6
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup --no-progress -y

      - name: Build current baseline package
        run: |
          $ErrorActionPreference = "Stop"
          python -m PyInstaller --noconfirm --clean --windowed --name Vegas_Total_Solution_Doc --paths src --collect-all vegas_doc --collect-all PySide6 src/main.py
          Move-Item -LiteralPath "dist/Vegas_Total_Solution_Doc" -Destination "dist/Vegas_Total_Solution_Doc_Baseline"
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          & $iscc "/DSourceDir=..\dist\Vegas_Total_Solution_Doc_Baseline" "/DOutputBase=Vegas_Total_Solution_Doc_Setup_Baseline" "installer/Vegas_Total_Solution_Doc.iss"
          python scripts/report_package_size.py --label before --distribution dist/Vegas_Total_Solution_Doc_Baseline --installer dist/installer/Vegas_Total_Solution_Doc_Setup_Baseline.exe --output artifacts/package_size_before.txt

      - name: Analyze largest baseline files
        run: |
          $ErrorActionPreference = "Stop"
          Get-Content -LiteralPath artifacts/package_size_before.txt

      - name: Build optimized one-folder package
        run: |
          $ErrorActionPreference = "Stop"
          python -m PyInstaller --noconfirm --clean Vegas_Total_Solution_Doc.spec
          python scripts/optimize_distribution.py dist/Vegas_Total_Solution_Doc
          if (-not (Test-Path -LiteralPath "dist/Vegas_Total_Solution_Doc/Vegas_Total_Solution_Doc.exe")) {
            Write-Error "::error title=Executable missing::Optimized PyInstaller build did not produce the expected executable."
          }

      - name: Run frozen startup smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          VEGAS_CLOVA_INVOKE_URL: ""
          VEGAS_CLOVA_SECRET_KEY: ""
        run: |
          $ErrorActionPreference = "Stop"
          $process = Start-Process -FilePath "dist/Vegas_Total_Solution_Doc/Vegas_Total_Solution_Doc.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            Write-Error "::error title=Frozen startup failed::Application exited early with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force

      - name: Build optimized Inno Setup installer
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          & $iscc "installer/Vegas_Total_Solution_Doc.iss"
          if (-not (Test-Path -LiteralPath "dist/installer/Vegas_Total_Solution_Doc_Setup.exe")) {
            Write-Error "::error title=Installer missing::Inno Setup did not produce the expected installer."
          }
          python scripts/report_package_size.py --label after --distribution dist/Vegas_Total_Solution_Doc --installer dist/installer/Vegas_Total_Solution_Doc_Setup.exe --output artifacts/package_size_after.txt

      - name: Compare sizes and enforce guard
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-Item -LiteralPath "dist/installer/Vegas_Total_Solution_Doc_Setup.exe"
          $distributionBytes = (Get-ChildItem -LiteralPath "dist/Vegas_Total_Solution_Doc" -File -Recurse | Measure-Object Length -Sum).Sum
          $installerMiB = $installer.Length / 1MB
          $distributionMiB = $distributionBytes / 1MB
          Write-Host ("Installer size: {0:N3} MiB" -f $installerMiB)
          Write-Host ("Distribution/installed size: {0:N3} MiB" -f $distributionMiB)
          Write-Host "Ten largest packaged files:"
          Get-ChildItem -LiteralPath "dist/Vegas_Total_Solution_Doc" -File -Recurse |
            Sort-Object Length -Descending |
            Select-Object -First 10 @{Name="MiB";Expression={"{0:N3}" -f ($_.Length / 1MB)}}, FullName |
            Format-Table -AutoSize
          if ($installerMiB -gt 120) {
            Write-Warning ("Installer exceeds the 120 MiB warning threshold: {0:N3} MiB" -f $installerMiB)
          }
          if ($installerMiB -gt 160) {
            Write-Error "::error title=Installer size limit exceeded::Installer exceeds the 160 MiB hard limit."
          }

      - name: Generate release checksum and manifest
        run: |
          $ErrorActionPreference = "Stop"
          $output = "dist/installer"
          $installer = Join-Path $output "Vegas_Total_Solution_Doc_Setup.exe"
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Vegas_Total_Solution_Doc_Setup.exe" | Set-Content -LiteralPath (Join-Path $output "checksums.txt") -Encoding ascii
          [ordered]@{
            product = "Vegas Total Solution Doc"
            version = "0.1.0"
            sha256 = $hash
            commit = "${{ github.sha }}"
            built_at_utc = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $output "build_manifest.json") -Encoding utf8

      - name: Upload optimized installer
        uses: actions/upload-artifact@v4
        with:
          name: Vegas-Total-Solution-Doc-Installer
          path: |
            dist/installer/Vegas_Total_Solution_Doc_Setup.exe
            dist/installer/checksums.txt
            dist/installer/build_manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload package size reports
        uses: actions/upload-artifact@v4
        with:
          name: package-size-report
          path: |
            artifacts/package_size_before.txt
            artifacts/package_size_after.txt
          if-no-files-found: error
          retention-days: 30
