name: Build Windows Installer

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

jobs:
  build-windows-installer:
    name: Test and package Windows release
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run complete test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = "Stop"
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw "Automated tests failed." }

      - name: Install Inno Setup 6
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }

      - name: Build optimized PyInstaller distribution
        env:
          QT_QPA_PLATFORM: offscreen
          VEGAS_BUILD_NUMBER: ${{ github.run_number }}
          VEGAS_BUILD_DATE: ${{ github.event.repository.updated_at }}
          VEGAS_GIT_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          cmd /c scripts\build_exe.bat
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller stage failed." }

      - name: Build Inno Setup installer
        env:
          ISCC_PATH: C:\Program Files (x86)\Inno Setup 6\ISCC.exe
        run: |
          $ErrorActionPreference = "Stop"
          cmd /c scripts\build_installer.bat
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup stage failed." }

      - name: Generate checksums and build manifest
        run: |
          $ErrorActionPreference = "Stop"
          .\.build-venv\Scripts\python.exe scripts\generate_release_metadata.py
          .\.build-venv\Scripts\python.exe scripts\package_size_report.py --after
          if ($LASTEXITCODE -ne 0) { throw "Release metadata stage failed." }

      - name: Enforce installer size policy
        run: |
          $ErrorActionPreference = "Stop"
          $installer = "dist/installer/Vegas_Total_Solution_Doc_Setup.exe"
          $sizeMb = (Get-Item -LiteralPath $installer).Length / 1MB
          "Actual installer size: {0:N2} MB" -f $sizeMb
          if ($sizeMb -gt 100) {
            Write-Warning "::warning title=Preferred size exceeded::Installer is $([math]::Round($sizeMb, 2)) MB; the preferred target is 100 MB or less."
          }
          if ($sizeMb -gt 120) {
            Write-Warning "::warning title=Installer size high::Installer is above 120 MB and should be reviewed."
          }
          if ($sizeMb -gt 160) {
            throw "Installer is $([math]::Round($sizeMb, 2)) MB, above the 160 MB hard limit."
          }
          Get-Content artifacts/package_size_after.txt

      - name: Verify release files
        run: |
          $ErrorActionPreference = "Stop"
          $required = @(
            "dist/installer/Vegas_Total_Solution_Doc_Setup.exe",
            "dist/installer/checksums.txt",
            "dist/installer/build_manifest.json"
          )
          $missing = $required | Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missing) { throw "Missing release files: $($missing -join ', ')" }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vegas-Total-Solution-Doc-Installer
          path: |
            dist/installer/Vegas_Total_Solution_Doc_Setup.exe
            dist/installer/checksums.txt
            dist/installer/build_manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload package size report
        uses: actions/upload-artifact@v4
        with:
          name: Vegas-Total-Solution-Doc-Package-Size
          path: artifacts/package_size_after.txt
          if-no-files-found: error
          retention-days: 30
