name: Build Windows Installer

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

jobs:
  build-windows-installer:
    name: Measure, optimize, and package Windows installer
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = "Stop"
          python -m pytest -q

      - name: Install Inno Setup 6
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { Write-Error "::error title=Inno Setup installation failed::Chocolatey installation failed." }

      - name: Build and measure baseline package
        run: |
          $ErrorActionPreference = "Stop"
          python -m PyInstaller --noconfirm --clean --windowed --name Vegas_Total_Solution_Doc --distpath dist/before --workpath build/before --specpath build/before --paths src --collect-all vegas_doc --collect-all PySide6 src/main.py
          if ($LASTEXITCODE -ne 0) { Write-Error "::error title=Baseline PyInstaller failed::The pre-optimization build failed." }
          Remove-Item -Recurse -Force dist/Vegas_Total_Solution_Doc -ErrorAction SilentlyContinue
          Copy-Item -Recurse dist/before/Vegas_Total_Solution_Doc dist/Vegas_Total_Solution_Doc
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = Join-Path $env:ProgramFiles "Inno Setup 6/ISCC.exe" }
          & $iscc "installer/Vegas_Total_Solution_Doc.iss"
          if ($LASTEXITCODE -ne 0) { Write-Error "::error title=Baseline Inno Setup failed::The baseline installer failed." }
          Move-Item -Force dist/installer/Vegas_Total_Solution_Doc_Setup.exe dist/installer/Vegas_Total_Solution_Doc_Setup_Before.exe
          python scripts/package_size_report.py --distribution dist/before/Vegas_Total_Solution_Doc --installer dist/installer/Vegas_Total_Solution_Doc_Setup_Before.exe

      - name: Build optimized one-folder package
        run: |
          $ErrorActionPreference = "Stop"
          .scriptsuild_exe.bat
          if ($LASTEXITCODE -ne 0) { Write-Error "::error title=Optimized PyInstaller failed::The optimized spec build failed." }
          .scriptsuild_installer.bat
          if ($LASTEXITCODE -ne 0) { Write-Error "::error title=Optimized Inno Setup failed::The optimized installer failed." }
          $installer = "dist/installer/Vegas_Total_Solution_Doc_Setup.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Vegas_Total_Solution_Doc_Setup.exe" | Set-Content dist/installer/checksums.txt -Encoding ascii
          [ordered]@{ product = "Vegas Total Solution Doc"; version = "0.1.0"; artifact = "Vegas_Total_Solution_Doc_Setup.exe"; sha256 = $hash; commit = "${{ github.sha }}"; workflow_run = "${{ github.run_id }}" } | ConvertTo-Json | Set-Content dist/installer/build_manifest.json -Encoding utf8
          python scripts/package_size_report.py --after

      - name: Compare package sizes and print largest files
        run: |
          $ErrorActionPreference = "Stop"
          Get-Content artifacts/package_size_before.txt
          Get-Content artifacts/package_size_after.txt
          $before = [double]((Select-String "Installer MB:" artifacts/package_size_before.txt).Line -replace "[^0-9.]","")
          $after = [double]((Select-String "Installer MB:" artifacts/package_size_after.txt).Line -replace "[^0-9.]","")
          $reduction = $before - $after
          $percent = if ($before -gt 0) { ($reduction / $before) * 100 } else { 0 }
          "Installer reduction: {0:N2} MB ({1:N2} percent)" -f $reduction, $percent
          if ($after -gt 120) { Write-Warning "::warning title=Installer exceeds preferred threshold::Installer is $after MB; preferred threshold is 120 MB." }
          if ($after -gt 160) { Write-Error "::error title=Installer size guard failed::Installer is $after MB, above the 160 MB hard limit." }
          Get-ChildItem -File -Recurse dist/Vegas_Total_Solution_Doc | Sort-Object Length -Descending | Select-Object -First 10 FullName,Length | Format-Table

      - name: Verify release files
        run: |
          $ErrorActionPreference = "Stop"
          $required = @("dist/installer/Vegas_Total_Solution_Doc_Setup.exe", "dist/installer/checksums.txt", "dist/installer/build_manifest.json", "artifacts/package_size_before.txt", "artifacts/package_size_after.txt")
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) { Write-Error "::error title=Release verification failed::Missing: $($missing -join ', ')" }
          $hash = (Get-FileHash dist/installer/Vegas_Total_Solution_Doc_Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Vegas_Total_Solution_Doc_Setup.exe" | Set-Content dist/installer/checksums.txt -Encoding ascii

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Vegas-Total-Solution-Doc-Installer
          path: |
            dist/installer/Vegas_Total_Solution_Doc_Setup.exe
            dist/installer/checksums.txt
            dist/installer/build_manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload package size report
        uses: actions/upload-artifact@v4
        with:
          name: package-size-report
          path: |
            artifacts/package_size_before.txt
            artifacts/package_size_after.txt
          if-no-files-found: error
          retention-days: 30
