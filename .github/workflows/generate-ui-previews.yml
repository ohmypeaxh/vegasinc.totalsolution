name: Generate UI Previews

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/generate_ui_previews.py"
      - ".github/workflows/generate-ui-previews.yml"

permissions:
  contents: read

jobs:
  generate-ui-previews:
    name: Render real PySide6 widgets
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run automated tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = "Stop"
          python -m pytest -q

      - name: Generate real PySide6 UI previews
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          VEGAS_CLOVA_INVOKE_URL: ""
          VEGAS_CLOVA_SECRET_KEY: ""
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/generate_ui_previews.py

      - name: Verify expected screenshots
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expected = @(
            "01_main_window.png",
            "02_dq_generator_project_info.png",
            "03_dq_generator_urs_import.png",
            "04_dq_generator_ocr_review.png",
            "05_dq_generator_requirement_review.png",
            "06_dq_generator_template_output.png",
            "07_settings_ocr.png",
            "08_first_run_onboarding.png",
            "09_about_dialog.png",
            "10_fds_generator.png",
            "11_fds_rules.png",
            "12_raw_data_generator.png"
          )
          $missing = $expected | Where-Object {
            -not (Test-Path -LiteralPath (Join-Path "artifacts/ui-previews" $_))
          }
          if ($missing) {
            Write-Error "::error title=UI preview verification failed::Missing screenshots: $($missing -join ', ')"
          }
          Get-ChildItem -LiteralPath "artifacts/ui-previews" -Filter "*.png" |
            Format-Table Name, Length

      - name: Upload UI preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vegas-Total-Solution-Doc-UI-Previews
          path: artifacts/ui-previews/
          if-no-files-found: error
          retention-days: 30
